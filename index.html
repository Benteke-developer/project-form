<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Request Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #e2e8f0;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    h1 { font-size: 22px; margin-bottom: 4px; }
    .sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
    }

    textarea { resize: vertical; min-height: 90px; }

    .field.invalid input,
    .field.invalid select,
    .field.invalid textarea { border-color: #ef4444; }

    .field.valid input,
    .field.valid select,
    .field.valid textarea { border-color: #22c55e; }

    .error {
      color: #f87171;
      font-size: 12px;
      margin-top: 5px;
      min-height: 14px;
    }

    .counter {
      text-align: right;
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: #052e16;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background: #16a34a; }
    button:active { transform: scale(0.98); }
    button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }

    .pay-status {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }
    .pay-status.waiting { display: block; background: #172554; color: #93c5fd; }
    .pay-status.error { display: block; background: #450a0a; color: #fca5a5; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #93c5fd;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .demo-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fbbf24;
      border: 1px solid #fbbf24;
      border-radius: 20px;
      padding: 2px 10px;
      margin-bottom: 12px;
    }

    /* Simulated M-Pesa prompt */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }
    .overlay.show { display: flex; }

    .prompt {
      background: #f8fafc;
      color: #0f172a;
      border-radius: 14px;
      width: 100%;
      max-width: 320px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      animation: pop 0.25s ease-out;
    }
    @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .prompt-head {
      background: #16a34a;
      color: #fff;
      font-weight: 700;
      padding: 12px 16px;
      font-size: 15px;
    }
    .prompt-body { padding: 16px; font-size: 14px; line-height: 1.5; }
    .prompt-body input {
      margin-top: 12px;
      background: #fff;
      color: #0f172a;
      border: 1px solid #94a3b8;
      text-align: center;
      font-size: 20px;
      letter-spacing: 8px;
    }
    .prompt-error { color: #dc2626; font-size: 12px; min-height: 16px; margin-top: 6px; }
    .prompt-actions { display: flex; border-top: 1px solid #e2e8f0; }
    .prompt-actions button {
      flex: 1;
      border-radius: 0;
      background: transparent;
      color: #16a34a;
      padding: 12px;
    }
    .prompt-actions button:hover { background: #f0fdf4; }
    .prompt-actions button.cancel { color: #64748b; border-right: 1px solid #e2e8f0; }

    .success { display: none; text-align: center; }
    .success .tick {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: #22c55e;
      color: #052e16;
      font-size: 30px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }

    .summary {
      text-align: left;
      background: #0f172a;
      border-radius: 8px;
      padding: 14px;
      margin: 18px 0;
      font-size: 14px;
      line-height: 1.8;
    }

    .summary span { color: #94a3b8; }
  </style>
</head>
<body>

  <div class="card">
    <!-- FORM VIEW -->
    <form id="requestForm" novalidate>
      <span class="demo-badge">DEMO MODE · SIMULATED M-PESA</span>
      <h1>Request a Project</h1>
      <p class="sub">Tell me what you need and I'll get back to you.</p>

      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="e.g. Jane Wanjiku" />
        <div class="error"></div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
        <div class="error"></div>
      </div>

      <div class="field">
        <label for="phone">Phone (Kenya)</label>
        <input type="tel" id="phone" placeholder="0712345678 or +254712345678" />
        <div class="error"></div>
      </div>

      <div class="field">
        <label for="service">Service</label>
        <select id="service">
          <option value="">-- Choose a service --</option>
          <option>Website</option>
          <option>Web App / Dashboard</option>
          <option>Automation / Bot</option>
          <option>Video Editing</option>
        </select>
        <div class="error"></div>
      </div>

      <div class="field">
        <label for="message">Project Details</label>
        <textarea id="message" maxlength="300" placeholder="Describe what you want built..."></textarea>
        <div class="counter"><span id="count">0</span>/300</div>
        <div class="error"></div>
      </div>

      <div class="field">
        <label for="amount">Deposit Amount (KES)</label>
        <input type="number" id="amount" min="1" placeholder="e.g. 500" />
        <div class="error"></div>
      </div>

      <button type="submit" id="submitBtn">Pay with M-Pesa</button>
      <div class="pay-status" id="payStatus"></div>
    </form>

    <!-- SUCCESS VIEW -->
    <div class="success" id="successBox">
      <div class="tick">✓</div>
      <h1>Request Received!</h1>
      <p class="sub">Here's what you sent:</p>
      <div class="summary" id="summary"></div>
      <button id="resetBtn">Send Another</button>
    </div>
  </div>

  <!-- SIMULATED M-PESA PROMPT -->
  <div class="overlay" id="overlay">
    <div class="prompt">
      <div class="prompt-head">M-PESA (Simulated)</div>
      <div class="prompt-body">
        <div id="promptText"></div>
        <input type="password" id="pinInput" maxlength="4" inputmode="numeric" placeholder="PIN" />
        <div class="prompt-error" id="pinError"></div>
      </div>
      <div class="prompt-actions">
        <button type="button" class="cancel" id="cancelPin">Cancel</button>
        <button type="button" id="sendPin">Send</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("requestForm");
    const submitBtn = document.getElementById("submitBtn");
    const successBox = document.getElementById("successBox");
    const summary = document.getElementById("summary");
    const message = document.getElementById("message");
    const count = document.getElementById("count");

    // Validation rules: each returns an error message, or "" if valid
    const rules = {
      name: (v) => v.trim().length < 3 ? "Enter at least 3 characters" : "",
      email: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? "" : "Enter a valid email",
      phone: (v) => /^(?:\+254|0)(7|1)\d{8}$/.test(v.replace(/\s/g, "")) ? "" : "Use format 07XXXXXXXX or +2547XXXXXXXX",
      service: (v) => v ? "" : "Please choose a service",
      message: (v) => v.trim().length < 15 ? "Give a bit more detail (15+ characters)" : "",
      amount: (v) => Number(v) >= 1 && Number.isInteger(Number(v)) ? "" : "Enter a whole amount, at least KES 1"
    };

    const payStatus = document.getElementById("payStatus");

    function showStatus(type, html) {
      payStatus.className = "pay-status " + type;
      payStatus.innerHTML = html;
    }

    function resetButton() {
      submitBtn.disabled = false;
      submitBtn.textContent = "Pay with M-Pesa";
    }

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    // ---- SIMULATED M-PESA ----
    // Shows a fake PIN prompt and resolves with success / failed,
    // the same shape a real STK push status check would return.
    const overlay = document.getElementById("overlay");
    const pinInput = document.getElementById("pinInput");
    const pinError = document.getElementById("pinError");

    function simulateStkPush(phone, amount) {
      return new Promise((resolve) => {
        document.getElementById("promptText").innerHTML =
          `Do you want to pay <b>KES ${escapeHTML(amount)}</b> to <b>DEMO SHOP</b>?<br>Enter M-PESA PIN:`;
        pinInput.value = "";
        pinError.textContent = "";
        overlay.classList.add("show");
        pinInput.focus();

        // Auto-timeout like a real prompt (60s)
        const timer = setTimeout(() => finish({ status: "failed", message: "No response from phone. Try again" }), 60000);

        function finish(result) {
          clearTimeout(timer);
          overlay.classList.remove("show");
          document.getElementById("sendPin").onclick = null;
          document.getElementById("cancelPin").onclick = null;
          resolve(result);
        }

        document.getElementById("cancelPin").onclick = () =>
          finish({ status: "failed", message: "You cancelled the payment" });

        document.getElementById("sendPin").onclick = () => {
          if (!/^\d{4}$/.test(pinInput.value)) {
            pinError.textContent = "PIN must be 4 digits";
            return;
          }
          // Any 4-digit PIN works, except 0000 to demo a wrong PIN
          if (pinInput.value === "0000") {
            return finish({ status: "failed", message: "Wrong M-Pesa PIN" });
          }
          finish({ status: "success", receipt: makeReceipt() });
        };
      });
    }

    // Fake receipt in M-Pesa style, e.g. SKE4X7T2QB
    function makeReceipt() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let r = "S";
      for (let i = 0; i < 9; i++) r += chars[Math.floor(Math.random() * chars.length)];
      return r;
    }

    // Check one field and show its state
    function validateField(id) {
      const input = document.getElementById(id);
      const field = input.parentElement;
      const errorMsg = rules[id](input.value);

      field.querySelector(".error").textContent = errorMsg;
      field.classList.toggle("invalid", errorMsg !== "");
      field.classList.toggle("valid", errorMsg === "");
      return errorMsg === "";
    }

    // Live validation as the user types
    Object.keys(rules).forEach((id) => {
      document.getElementById(id).addEventListener("input", () => validateField(id));
    });

    // Character counter
    message.addEventListener("input", () => {
      count.textContent = message.value.length;
    });

    // Submit
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const allValid = Object.keys(rules).map(validateField).every(Boolean);
      if (!allValid) return;

      const phone = document.getElementById("phone").value;
      const amount = document.getElementById("amount").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending prompt...";
      payStatus.className = "pay-status";

      try {
        // 1. "Send" the STK push
        await wait(1200);

        // 2. Show the simulated PIN prompt
        submitBtn.textContent = "Waiting for payment...";
        showStatus("waiting", `<span class="spinner"></span>Enter your M-Pesa PIN in the prompt`);

        const result = await simulateStkPush(phone, amount);

        if (result.status === "success") {
          showStatus("waiting", `<span class="spinner"></span>Confirming payment...`);
          await wait(1500);
        }

        if (result.status !== "success") {
          showStatus("error", escapeHTML(result.message));
          return resetButton();
        }

        // 3. Paid: show the summary
        const details = {
          Name: document.getElementById("name").value,
          Email: document.getElementById("email").value,
          Phone: phone,
          Service: document.getElementById("service").value,
          "Amount Paid": "KES " + amount,
          "M-Pesa Receipt": result.receipt + " (simulated)",
          Details: message.value
        };

        summary.innerHTML = Object.entries(details)
          .map(([key, val]) => `<span>${key}:</span> ${escapeHTML(val)}`)
          .join("<br>");

        form.style.display = "none";
        successBox.style.display = "block";
      } catch (err) {
        showStatus("error", "Network error. Check your connection and try again");
        resetButton();
      }
    });

    // Reset back to the form
    document.getElementById("resetBtn").addEventListener("click", () => {
      form.reset();
      count.textContent = "0";
      document.querySelectorAll(".field").forEach((f) => {
        f.classList.remove("valid", "invalid");
        f.querySelector(".error").textContent = "";
      });
      resetButton();
      payStatus.className = "pay-status";
      successBox.style.display = "none";
      form.style.display = "block";
    });

    // Prevent HTML injection in the summary
    function escapeHTML(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
